name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  test:
    # Pinned to macos-26 to match the release build env (release.yml). Keep an
    # explicit pin (never macos-latest) so runner migrations can't drift the SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Rust tests
        run: cargo test --workspace
